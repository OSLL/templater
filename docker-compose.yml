services:
    web:
        restart: always
        build: .
        command: python3 -u runapp.py
        ports:
          - "8092:5000"
        volumes:
          - /etc/localtime:/etc/localtime:ro
          - /etc/timezone:/etc/timezone:ro
        links:
          - db

    db:
        image: mongo:8-noble
        restart: always
        volumes:
          - /etc/localtime:/etc/localtime:ro
          - /etc/timezone:/etc/timezone:ro
